<section>
<h2>اليوم 1: أدوار الدولة وأدواتها والقيمة العامة</h2>
<ol>
<li><p>تشغّل الوزارة تطبيق بطاقة النقل الميسّر، وتكتب معيار التطبيقات الذي يلتزم به مشغلو النقل، ووحدة التطبيق نفسها تعتمد نتائج اختبار التطبيقات كلها. ما أنسب ضمانة؟</p><ul><li><b>أ.</b> نشر بيان بأن الوزارة تشغّل تطبيقًا وتكتب المعيار</li><li><b>ب.</b> اعتماد النتائج من وحدة لا تتبع التشغيل، بمعيار واحد للجميع</li><li><b>ج.</b> اختبار تطبيق الوزارة بعدد أكبر من الحالات قبل كل إصدار جديد</li><li><b>د.</b> إعفاء تطبيق الوزارة من المعيار، لأن رقابتها الداخلية تكفي</li></ul></li>
<li><p>يكتب فريق سببًا لدرجة «نطاق التأثير» للتمويل في مثال مشغلي النقل. أي سبب يقبله دليل التقدير؟</p><ul><li><b>أ.</b> التمويل أداة قوية لأن المال يحرك الجهات</li><li><b>ب.</b> أُعلن التمويل لكل المشغلين الأربعين</li><li><b>ج.</b> ميزانية التمويل 2.1 مليون ريال في خمس سنوات</li><li><b>د.</b> تكفي الميزانية لستة مشغلين من 40 (15%)، فالدرجة 2</li></ul></li>
<li><p>يكتب زميل في مذكرة إلى الوكيلة أربع جمل عن نظام المنافسات والمشتريات الحكومية الجديد. أي جملة يسندها نص النظام؟</p><ul><li><b>أ.</b> من أهدافه أفضل قيمة للمال العام بمراعاة تكلفة دورة الحياة</li><li><b>ب.</b> يشترط النظام اختبارًا مستقلًا لكل نظام ذكاء اصطناعي قبل الاستلام</li><li><b>ج.</b> صار نافذًا في المشتريات الحكومية من يوم نشره في سبتمبر 2026</li><li><b>د.</b> يحدد النظام نسبة أفضلية للمحتوى المحلي في التقييم الفني</li></ul></li>
<li><p>في مسودة تقرير عن مساعد بطاقة النقل الميسّر أربع منافع. أيها تُكتب في عمود القيمة العامة؟</p><ul><li><b>أ.</b> بلغت المحادثات مع المساعد 30,000 محادثة في الربع الأول من السنة</li><li><b>ب.</b> فازت الوزارة بجائزة إقليمية للخدمة الرقمية</li><li><b>ج.</b> انخفضت الطلبات المعادة لنقص مستند لدى كبار السن على الهاتف</li><li><b>د.</b> ألغت الوزارة عقد طباعة البطاقات الورقية فوفرت 80,000 ريال في السنة</li></ul></li>
<li><p>وزارة تشغّل مساعدًا يجيب المتقدمين، وتريد إدارتها نفسها أن تقرّ صلاحيته للاستخدام. أي ترتيب يعالج تعارض دور المشغّل مع دور المقرّ؟</p><ul><li><b>أ.</b> أن تتولى المراجعة لجنة تُشكَّل داخل الإدارة نفسها التي تشغّل المساعد وتطوّره</li><li><b>ب.</b> أن يوقّع المزوّد إقرارًا بأن النموذج آمن قبل الإطلاق</li><li><b>ج.</b> مراجعة طرف مستقل عن فريق التشغيل، ترفع نتيجتها إلى جهة لا تتبعه</li><li><b>د.</b> أن تنشر الوزارة كل شهر عدد المحادثات التي أجراها المساعد مع المتقدمين</li></ul></li>
<li><p>فريق يقارن أدوات السياسات بنطاق التأثير والتكلفة والسرعة، فأعطى التنظيم الملزم أعلى درجة في السرعة «لأن الالتزام به إجباري». ما الخطأ؟</p><ul><li><b>أ.</b> الإلزام يرفع نطاق التأثير، والسرعة تقاس بالمدة حتى يبدأ الأثر</li><li><b>ب.</b> لا خطأ، فالمخالف يعاقب من اليوم الأول فيبدأ الأثر فورًا عند كل المشمولين</li><li><b>ج.</b> السرعة لا تدخل في المقارنة لأن الأدوات كلها تحتاج المدة نفسها</li><li><b>د.</b> التنظيم أسرع لأنه لا يحتاج إلى ميزانية تشغيل</li></ul></li>
<li><p>عرضان لتطبيق خدمة: الأول أرخص في السنة الأولى، والثاني أرخص على خمس سنوات بعد احتساب تكلفة الخروج. على أي أساس يقارنهما نظام المنافسات والمشتريات الحكومية (1448هـ)؟</p><ul><li><b>أ.</b> على تكلفة السنة الأولى، لأنها ما تتحمله ميزانية هذا العام المعتمدة</li><li><b>ب.</b> على شهرة المنصة التي يذكرها العرض، لأنها أقل مخاطرة</li><li><b>ج.</b> على العرض الأطول مدة، لأنه يضمن استمرار الخدمة دون انقطاع للمستفيدين</li><li><b>د.</b> على أفضل قيمة للمال العام بمراعاة تكلفة دورة الحياة كلها</li></ul></li>
<li><p>يجيز نظام المنافسات والمشتريات الحكومية (1448هـ) أن تذكر المواصفات علامة تجارية بعينها لنموذج ذكاء اصطناعي ما دام هو الأفضل في السوق.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>دراسة قيمة تُظهر صافيًا موجبًا للخدمة كلها، لكن ساعات الوفر لكبار السن على الهاتف أقل بكثير منها لمستخدمي البوابة. ما الذي يطلبه التحليل التوزيعي؟</p><ul><li><b>أ.</b> الاكتفاء بالصافي الإجمالي ما دام موجبًا للخدمة كلها على السنوات الخمس</li><li><b>ب.</b> عرض الآثار بحسب الفئات بقدر حجمها، فالمتوسط قد يخفي فئة لا تنتفع</li><li><b>ج.</b> حذف الفئة الأقل استخدامًا من الحساب لأنها تشوّه متوسط الخدمة</li><li><b>د.</b> رفع تقدير منفعة كبار السن حتى تتساوى الفئات</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من دراسة القيمة إلى قرار الاختبار</h2>
<ol>
<li><p>تريد الوزارة أن يتحسن ما تقوله تطبيقات النقل الخاصة عن خصومات حاملي البطاقة، وعددها 40. قبل أن تختار أداة، ما أول ما تكتبه؟</p><ul><li><b>أ.</b> لائحة ملزمة لأنها الأداة الأقوى بين الأدوات الثماني</li><li><b>ب.</b> الميزانية المتاحة للوزارة في السنة القادمة</li><li><b>ج.</b> المشكلة بدقة، ومن يجب أن يتغير سلوكه لتُحل</li><li><b>د.</b> اسم النموذج الذي ستستعمله التطبيقات</li></ul></li>
<li><p>في دراسة قيمة لمساعد بطاقة النقل: «يوفر المساعد 900 ساعة من وقت الموظفين، أي 144,000 ريال وفرًا في الميزانية، و144,000 ريال طاقة إضافية للمكاتب». لا وظائف تُلغى. ما الخطأ؟</p><ul><li><b>أ.</b> الساعات عُدّت مرتين، ولا يخرج منها مال من الميزانية</li><li><b>ب.</b> قيمة الساعة يجب أن تكون أقل من 160 ريالًا</li><li><b>ج.</b> ساعات الموظفين لا تُعدّ منفعة في أي حساب، لأن رواتبهم تُدفع على أي حال</li><li><b>د.</b> الخطأ الوحيد أن الرقم لم يُخصم بمعدل 4%</li></ul></li>
<li><p>في خدمة بطاقة النقل الميسّر: إلغاء بطاقة حاملها لأن شروطها لم تعد تنطبق عليه. أين تضعها؟</p><ul><li><b>أ.</b> يجيب المساعد من الدليل</li><li><b>ب.</b> يعدّ المساعد مسودة الإلغاء ويعتمدها موظف</li><li><b>ج.</b> يحيل المساعد فورًا إلى الطوارئ</li><li><b>د.</b> يقرر موظف، ويُبلَّغ الحامل بطريق التظلم</li></ul></li>
<li><p>اختبار مساعد بطاقة النقل على 15 زوجًا: 9 نجحت في اللغتين، 4 بالعربية وحدها، 1 بالإنجليزية وحدها، 1 أخفق فيهما. ماذا تستنتج أولًا؟</p><ul><li><b>أ.</b> أسئلة الإنجليزية أصعب من أسئلة العربية</li><li><b>ب.</b> المشكلة الأهم الزوج الذي أخفق في اللغتين</li><li><b>ج.</b> في أربعة أسئلة يُعامل المتحدث بالإنجليزية معاملة أقل</li><li><b>د.</b> النجاح 23 من 30، فالمساعد مقبول ما دامت النسبة فوق 75%</li></ul></li>
<li><p>إعداد لمساعد بطاقة النقل: العربية 18 من 20 (90%)، والإنجليزية 18 من 20 (90%)، وإخفاق حرج واحد: وعد راكبًا بأن طلب بطاقته «سيُقبل». ما القرار؟</p><ul><li><b>أ.</b> إطلاق، لأن النسبتين 90% والفرق بين اللغتين صفر</li><li><b>ب.</b> إصلاح، لأن فيه إخفاقًا حرجًا غير موقف</li><li><b>ج.</b> إيقاف، لأن كل إخفاق حرج يوقف الإطلاق</li><li><b>د.</b> إطلاق بعد حذف الحالة من المجموعة</li></ul></li>
<li><p>إذا لم تُلغَ وظائف ولا عقود بسبب المساعد، فإن ساعات الموظفين الموفّرة تبقى قيمة عامة، لكنها لا تظهر وفرًا ماليًا في الميزانية.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في المثال الموازي (بطاقة النقل الميسّر) نسبة المنافع إلى التكاليف 1.02، لكن صافي القيمة في حساب الميزانية سالب. لماذا؟</p><ul><li><b>أ.</b> لأن خصم 4% في السنة يجعل كل مشروع حكومي سالبًا في الحساب المالي</li><li><b>ب.</b> لأن النسبة حُسبت خطأً، والصحيح أن تكون أقل من 1</li><li><b>ج.</b> لأن المنافع وقت وجهد لا يعود منهما نقد إلى ميزانية الوزارة</li><li><b>د.</b> لأن المنافع تُحسب في السنة الأولى وحدها والتكاليف على خمس سنوات</li></ul></li>
<li><p>لماذا تُطرح تكلفة الإجابات الخاطئة من منافع المساعد في دراسة القيمة العامة؟</p><ul><li><b>أ.</b> لأنها تكلفة يتحملها المزوّد، فتُخصم من قيمة العقد عند الدفع له</li><li><b>ب.</b> لا تُطرح من المنافع، فمكانها سجل المخاطر وحده لا دراسة القيمة</li><li><b>ج.</b> لأن النظام يفرض غرامة على الجهة عن كل إجابة خاطئة</li><li><b>د.</b> لأنها أثر سلبي للخدمة: وقت يضيع على المتقدم وطلب قد يُرفض</li></ul></li>
<li><p>يقترح فريق خدمة بطاقة النقل الميسّر أن يخفض المساعد آليًا نسبة خصم الحامل إذا ظهر في بياناته تغير في دخله، دون موظف. أي ترتيب يتسق مع توجيه كندا للقرار الآلي ومع القسم 3.3 من مبادئ الذكاء الاصطناعي التوليدي؟</p><ul><li><b>أ.</b> أن يُشعَر الحامل برسالة واضحة بأن القرار آلي، ثم يُخفَّض الخصم</li><li><b>ب.</b> أن يتخذ موظف القرار، وتبقى للحامل قناة غير آلية وطريق للتظلم</li><li><b>ج.</b> أن تُقبل الأتمتة ما دامت دقة النموذج أعلى من دقة الموظفين في المتوسط</li><li><b>د.</b> أن يُمنع الذكاء الاصطناعي في أي خطوة من الخدمة</li></ul></li>
<li><p>اختُبر مساعد على 30 حالة: نجح بالعربية في 13 من 15، وبالإنجليزية في 10 من 15. لماذا لا يكفي أن يُقال إن نجاحه 76.7%؟</p><ul><li><b>أ.</b> لأن الرقم الإجمالي يخفي فرقًا بين اللغتين قدره 20 نقطة</li><li><b>ب.</b> لأن 30 حالة قليلة، فلا يُستنتج منها شيء</li><li><b>ج.</b> لأن النسبة يجب أن تُحسب على العربية وحدها، فهي لغة الخدمة</li><li><b>د.</b> لأن الرقم مقبول، ونتيجة الإنجليزية لا تهم ما دام أغلب المتقدمين عربًا</li></ul></li>
<li><p>الحالة المزدوجة (السؤال نفسه بالعربية والإنجليزية) تُظهر هل يعامل المساعد المتحدثين باللغتين المعاملة نفسها.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>بحسب قاعدة القرار في هذا المقرر: نجح مساعد في 95% من الحالات العربية و93% من الإنجليزية، لكنه نصح في حالة واحدة شخصًا في خطر بالانتظار بدل توجيهه إلى الطوارئ. ما القرار؟</p><ul><li><b>أ.</b> إطلاق، لأن النسبتين فوق 90% والفرق بينهما 2 نقطة</li><li><b>ب.</b> إصلاح، لأن الإخفاق حالة واحدة من أربعين حالة</li><li><b>ج.</b> إطلاق مع مراقبة الحالات الطارئة بعد التشغيل</li><li><b>د.</b> إيقاف، فالإخفاق الحرج في السلامة يوقف الإطلاق</li></ul></li>
<li><p>بحسب قاعدة القرار في هذا المقرر: نجح مساعد في 96% من الحالات العربية و90% من الإنجليزية، ولا إخفاق حرجًا. ما القرار؟</p><ul><li><b>أ.</b> إطلاق، لأن النسبتين عند 90% أو فوقها</li><li><b>ب.</b> إيقاف، لأن الإنجليزية عند الحد الأدنى تمامًا</li><li><b>ج.</b> إصلاح ثم إعادة الاختبار</li><li><b>د.</b> إطلاق بالعربية وحدها، وإيقاف الإنجليزية</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: المساءلة أمام الجمهور وقدرات الخدمة المدنية</h2>
<ol>
<li><p>وصلك تقرير اختبار لمساعد بطاقة النقل الميسّر في ثلاث صفحات. بقاعدة المقرر، ما أول ما تبحث عنه قبل أن تقرأ النسب؟</p><ul><li><b>أ.</b> النسبة الإجمالية للنجاح في الحالات كلها</li><li><b>ب.</b> الإخفاقات الحرجة، وهل فيها سلامة أو خصوصية</li><li><b>ج.</b> عدد الأزواج التي نجحت بالعربية وأخفقت بالإنجليزية</li><li><b>د.</b> اسم النموذج المستضاف الذي شُغّلت عليه الحالات</li></ul></li>
<li><p>من مسودة سجل شفافية لمساعد بطاقة النقل الميسّر، يقرؤه الركاب. أي سطر يُبقى كما هو؟</p><ul><li><b>أ.</b> يعمل المساعد بنموذج لغوي كبير مضبوط بتعليمات نظام</li><li><b>ب.</b> المساعد دقيق دائمًا، فلا حاجة إلى التحقق من إجاباته</li><li><b>ج.</b> يرفع المساعد كفاءة العمليات الداخلية في الوزارة</li><li><b>د.</b> يشرح المساعد الخصومات، ولا يقبل الطلبات ولا يرفضها</li></ul></li>
<li><p>في سجل مخاطر مساعد بطاقة النقل: «راكب عالق لا يُصعَّد إلى الطوارئ: 2 × 4 = 8؛ المعالجة: القبول؛ اعتمد القبول مدير الخدمة». ما الخطأ بقواعد الوزارة؟</p><ul><li><b>أ.</b> الخطر مرتفع، فلا يقبله إلا الوكيلة بعد مراجعة مستقلة</li><li><b>ب.</b> المستوى خاطئ، فحاصل 2 × 4 في نطاق «متوسط» في السلم</li><li><b>ج.</b> القبول ممنوع في الإطار الوطني لأي خطر</li><li><b>د.</b> الخطر غير مرجّح، فلا يُكتب في السجل أصلًا</li></ul></li>
<li><p>رُفض طلب بطاقة نقل ميسّر لراكب، فتظلم بالإنجليزية. أي ترتيب يتسق مع ما تعلمته اليوم؟</p><ul><li><b>أ.</b> يعيد المساعد دراسة الطلب ويرد على الراكب خلال ساعة</li><li><b>ب.</b> يراجعه الموظف الذي رفض، لأنه يعرف الملف ويرد بسرعة</li><li><b>ج.</b> تراجعه وحدة لم تشارك في الرفض، بالإنجليزية، في مدة معلنة</li><li><b>د.</b> يُطلب من الراكب أن يعيد كتابة التظلم بالعربية أولًا</li></ul></li>
<li><p>خطة كفاءات لموظفي خدمة بطاقة النقل الذين يعتمدون رسائل يقترحها المساعد. أي مقياس يقول إن الخطة نجحت؟</p><ul><li><b>أ.</b> نسبة الموظفين الذين أتموا البرنامج التدريبي كاملًا</li><li><b>ب.</b> نسبة الرسائل الخاطئة التي يلتقطها الموظف قبل إرسالها</li><li><b>ج.</b> متوسط رضا المتدربين عن المدرب والمحتوى</li><li><b>د.</b> نسبة النجاح في اختبار نهاية البرنامج التدريبي</li></ul></li>
<li><p>ما الذي يميز سجل الشفافية المنشور عن قيد النظام في سجل الأنظمة الداخلي؟</p><ul><li><b>أ.</b> أنه يحوي الشفرة المصدرية وإعدادات النموذج وبيانات تدريبه</li><li><b>ب.</b> أنه مكتوب للجمهور: ماذا يفعل النظام ومن المسؤول عنه</li><li><b>ج.</b> أنه وثيقة داخلية لا يطّلع عليها إلا المدقق</li><li><b>د.</b> أنه يغني عن القيد الداخلي، فلا حاجة إلى الاثنين معًا في الوزارة</li></ul></li>
<li><p>خطر احتماليته 1 (نادر) وأثره 4 (كارثي). ما مستواه بحسب الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي؟</p><ul><li><b>أ.</b> 4، متوسط</li><li><b>ب.</b> 4، كارثي</li><li><b>ج.</b> 5، متوسط</li><li><b>د.</b> 16، كارثي</li></ul></li>
<li><p>نقل الخطر إلى المزوّد بعقد يرفع عن الوزارة مسؤوليتها عنه بحسب الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أُلغيت بطاقة نقل ميسّر لحاملها بقرار موظف استند إلى اقتراح من المساعد، فتظلّم. من يراجع التظلم؟</p><ul><li><b>أ.</b> مشرف الموظف، لأنه اعتمد قرار الإلغاء الأصلي</li><li><b>ب.</b> مشغّل النقل، لأنه يعرف رحلات الحامل وسلوكه</li><li><b>ج.</b> موظف مؤهل لم يشارك في قرار الإلغاء، ويملك تعديله</li><li><b>د.</b> لجنة تجتمع كل ستة أشهر حين تتجمع التظلمات</li></ul></li>
<li><p>في إطار المعايير المهنية في البيانات والذكاء الاصطناعي، ما معنى أن عنصرًا في بطاقة مهنة عند المستوى L3؟</p><ul><li><b>أ.</b> أن الموظف في المرتبة الثالثة من سلم الخدمة المدنية</li><li><b>ب.</b> أن الموظف أمضى ثلاث سنوات على الأقل في المهنة نفسها</li><li><b>ج.</b> أن المهنة تتطلب ثلاث شهادات معتمدة</li><li><b>د.</b> أن العنصر أعقد من عناصر L1 وL2</li></ul></li>
<li><p>تحتاج وزارة إلى من يقود تقييم المخاطر لمساعد المواطنين ويحدّث سجلها. أي بطاقة في إطار المعايير المهنية أقرب إلى الدور؟</p><ul><li><b>أ.</b> محلل مخاطر الذكاء الاصطناعي (AI-RA)</li><li><b>ب.</b> مدير منتج الذكاء الاصطناعي (AI-PM)</li><li><b>ج.</b> الرئيس التنفيذي للذكاء الاصطناعي (AI-CO)</li><li><b>د.</b> أخصائي حوكمة البيانات (D-DG)</li></ul></li>
<li><p>بطاقة المهنة في إطار المعايير المهنية في البيانات والذكاء الاصطناعي تصف وظيفة في جهة بعينها، فلا تصلح لوزارة أخرى.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>خطة تطوير تضع موظفي الوزارة كلهم في برنامج عام واحد عن الذكاء الاصطناعي. ما عيبها الأساسي؟</p><ul><li><b>أ.</b> أنها أغلى دائمًا من البرامج المتخصصة</li><li><b>ب.</b> أنها لا تبدأ من الأدوار المستهدفة ومستوياتها</li><li><b>ج.</b> أن البرامج العامة ممنوعة في الجهات الحكومية</li><li><b>د.</b> أنها تُسند التدريب إلى مزوّد خارجي لا يعرف الوزارة</li></ul></li>
<li><p>إحاطة وزارية مدتها 8 دقائق أمام لجنة. ما الذي يأتي أولًا؟</p><ul><li><b>أ.</b> خلفية عن الذكاء الاصطناعي ونماذجه</li><li><b>ب.</b> منهج الاختبار بالتفصيل قبل نتيجته</li><li><b>ج.</b> قائمة بكل المخاطر المحتملة دون ترتيب</li><li><b>د.</b> التوصية والقرار المطلوب، ثم الأدلة</li></ul></li>
<li><p>سألت اللجنة سؤالًا لا تجد جوابه في أدلتك. ما الرد الأنسب؟</p><ul><li><b>أ.</b> أن تقول ما لا تعرفه، ومتى ستأتي بالجواب</li><li><b>ب.</b> أن تقدّر رقمًا قريبًا حتى لا تبدو غير مستعد</li><li><b>ج.</b> أن تحيل السؤال إلى المزوّد</li><li><b>د.</b> أن تعيد عرض التوصية وأدلتها كما قدمتها</li></ul></li>
<li><p>على الموجز أن يذكر النص النافذ في تاريخ الإحاطة، فإن كان نظام جديد صدر ولم يبدأ العمل به بعدُ ذُكر ذلك صراحة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>

وات كلها تحتاج المدة نفسها"},{"key":"د","text":"التنظيم أسرع لأنه لا يحتاج إلى ميزانية تشغيل"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"لكل معيار سؤال واحد: النطاق يسأل من يصل إليه الأثر، والسرعة تسأل متى يبدأ. الإلزام جواب السؤال الأول لا الثاني.","misconceptions":["","العقوبة لا تبدأ قبل صدور اللائحة والعمل بها، ومدة الإصدار هي ما يقيسه معيار السرعة","الأدوات تختلف كثيرًا في المدة: الإرشادات تصدر في أسابيع والتنظيم في شهور","هذا خلط بين معيار التكلفة ومعيار السرعة، ثم إن للتنظيم تكلفة إشراف وإنفاذ"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-s3-life-cycle","type":"single","prompt":"عرضان لتطبيق خدمة: الأول أرخص في السنة الأولى، والثاني أرخص على خمس سنوات بعد احتساب تكلفة الخروج. على أي أساس يقارنهما نظام المنافسات والمشتريات الحكومية (1448هـ)؟","options":[{"key":"أ","text":"على تكلفة السنة الأولى، لأنها ما تتحمله ميزانية هذا العام المعتمدة"},{"key":"ب","text":"على شهرة المنصة التي يذكرها العرض، لأنها أقل مخاطرة"},{"key":"ج","text":"على العرض الأطول مدة، لأنه يضمن استمرار الخدمة دون انقطاع للمستفيدين"},{"key":"د","text":"على أفضل قيمة للمال العام بمراعاة تكلفة دورة الحياة كلها"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"المادة الثانية من النظام الجديد تنص على أفضل قيمة بمراعاة تكلفة دورة الحياة. والنظام يعمل به بعد 120 يومًا من نشره، وقبل ذلك يبقى نظام (م/128) نافذًا.","misconceptions":["تكلفة السنة الأولى جزء من دورة الحياة، والنظام يطلب الدورة كلها","المادة 22 تمنع ذكر العلامات التجارية في المواصفات، والشهرة ليست قيمة للمال","طول العقد لا يعني قيمة أفضل، وقد يزيد كلفة الخروج والارتهان للمزوّد",""],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-s3-brand-tf","type":"tf","prompt":"يجيز نظام المنافسات والمشتريات الحكومية (1448هـ) أن تذكر المواصفات علامة تجارية بعينها لنموذج ذكاء اصطناعي ما دام هو الأفضل في السوق.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"خطأ. المادة الثانية والعشرون تمنع ذكر العلامات التجارية في المواصفات، فتُكتب المواصفة بالأداء المطلوب لا باسم المنتج.","misconceptions":["من يظن أن «الأفضل في السوق» يبرر تسمية المنتج يغلق المنافسة قبل أن تبدأ",""],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-s4-distribution","type":"single","prompt":"دراسة قيمة تُظهر صافيًا موجبًا للخدمة كلها، لكن ساعات الوفر لكبار السن على الهاتف أقل بكثير منها لمستخدمي البوابة. ما الذي يطلبه التحليل التوزيعي؟","options":[{"key":"أ","text":"الاكتفاء بالصافي الإجمالي ما دام موجبًا للخدمة كلها على السنوات الخمس"},{"key":"ب","text":"عرض الآثار بحسب الفئات بقدر حجمها، فالمتوسط قد يخفي فئة لا تنتفع"},{"key":"ج","text":"حذف الفئة الأقل استخدامًا من الحساب لأنها تشوّه متوسط الخدمة"},{"key":"د","text":"رفع تقدير منفعة كبار السن حتى تتساوى الفئات"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"الدليل الأخضر يطلب تحليل التوزيع بقدر يتناسب مع الآثار، لأن رقمًا واحدًا للخدمة كلها قد يخفي أن فئة بعينها لا تنتفع.","misconceptions":["الصافي الموجب لا يقول من انتفع ومن لم ينتفع، وهذا هو سؤال التوزيع","","الفئة الأقل انتفاعًا هي ما يجب أن يظهر، وحذفها يخفي الأثر بدل أن يقيسه","تعديل التقدير ليبدو متساويًا تزوير للدليل، والمطلوب عرض الفرق ثم معالجته"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-s1-staff-hours-tf","type":"tf","prompt":"إذا لم تُلغَ وظائف ولا عقود بسبب المساعد، فإن ساعات الموظفين الموفّرة تبقى قيمة عامة، لكنها لا تظهر وفرًا ماليًا في الميزانية.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"صح. الساعات تُعاد توجيهها إلى عمل آخر، فهي قيمة، ولا يصير منها نقد إلا إذا أُلغيت تكلفة فعلًا.","misconceptions":["","من يعدّ كل ساعة موفّرة ريالًا في الميزانية يخلط القيمة العامة بالوفر المالي"],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-s1-fiscal-npv"," t":"يقترح فريق خدمة بطاقة النقل الميسّر أن يخفض المساعد آليًا نسبة خصم الحامل إذا ظهر في بياناته تغير في دخله، دون موظف. أي ترتيب يتسق مع توجيه كندا للقرار الآلي ومع القسم 3.3 من مبادئ الذكاء الاصطناعي التوليدي؟","options":[{"key":"أ","text":"أن يُشعَر الحامل برسالة واضحة بأن القرار آلي، ثم يُخفَّض الخصم"},{"key":"ب","text":"أن يتخذ موظف القرار، وتبقى للحامل قناة غير آلية وطريق للتظلم"},{"key":"ج","text":"أن تُقبل الأتمتة ما دامت دقة النموذج أعلى من دقة الموظفين في المتوسط"},{"key":"د","text":"أن يُمنع الذكاء الاصطناعي في أي خطوة من الخدمة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"التوجيه الكندي يطلب في الأثر المرتفع أن يتخذ إنسان القرار النهائي ويوفّر طريق التظلم، والقسم 3.3 يطلب إعلام المستفيد وقناة غير آلية. التوجيه الكندي مثال للمقارنة لا نص نافذ في المملكة.","misconceptions":["الإشعار شرط واحد من عدة شروط، ولا يغني عن قرار بشري وطريق للتظلم","","المتوسط لا يحمي الحامل الذي أُخطئ في حقه، والمساءلة تطلب من يُسأل عن القرار","المنع الكامل يضيّع منافع مثل شرح الخصومات من الدليل المنشور"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-s3-language-gap","type":"single","prompt":"اختُبر مساعد على 30 حالة: نجح بالعربية في 13 من 15، وبالإنجليزية في 10 من 15. لماذا لا يكفي أن يُقال إن نجاحه 76.7%؟","options":[{"key":"أ","text":"لأن الرقم الإجمالي يخفي فرقًا بين اللغتين قدره 20 نقطة"},{"key":"ب","text":"لأن 30 حالة قليلة، فلا يُستنتج منها شيء"},{"key":"ج","text":"لأن النسبة يجب أن تُحسب على العربية وحدها، فهي لغة الخدمة"},{"key":"د","text":"لأن الرقم مقبول، ونتيجة الإنجليزية لا تهم ما دام أغلب المتقدمين عربًا"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المساواة في المعاملة بين اللغات شرط مستقل، فتُعرض النتيجة لكل لغة ويُقرأ الفرق بينهما قبل أي رقم إجمالي.","misconceptions":["","العدد صغير ويوجب الحذر، لكنه يكفي ليُظهر فرقًا بهذا الحجم","المتحدث بالإنجليزية متقدم للخدمة نفسها، والمساواة بين اللغات جزء من الاختبار","الأغلبية لا تُسقط حق الأقلية في معاملة مساوية"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-s3-pairs-tf","type":"tf","prompt":"الحالة المزدوجة (السؤال نفسه بالعربية والإنجليزية) تُظهر هل يعامل المساعد المتحدثين باللغتين المعاملة نفسها.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"صح. حين يتساوى السؤال ويختلف اللسان وحده، فكل فرق في النتيجة فرق في المعاملة.","misconceptions":["","من يظن أن الحالات المزدوجة تكرار لا فائدة منه يفوته أنها الطريقة الوحيدة لعزل أثر اللغة"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-s4-safety-stop","type":"single","prompt":"بحسب قاعدة القرار في هذا المقرر: نجح مساعد في 95% من الحالات العربية و93% من الإنجليزية، لكنه نصح في حالة واحدة شخصًا في خطر بالانتظار بدل توجيهه إلى الطوارئ. ما القرار؟","options":[{"key":"أ","text":"إطلاق، لأن النسبتين فوق 90% والفرق بينهما 2 نقطة"},{"key":"ب","text":"إصلاح، لأن الإخفاق حالة واحدة من أربعين حالة"},{"key":"ج","text":"إطلاق مع مراقبة الحالات الطارئة بعد التشغيل"},{"key":"د","text":"إيقاف، فالإخفاق الحرج في السلامة يوقف الإطلاق"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"قاعدة المقرر (وهي من وضعه، لا من مرجع وطني): إخفاق حرج في السلامة أو الخصوصية، أو لغة دون 70%، يعني إيقافًا.","misconceptions":["النسب لا تُقرأ قبل الإخفاقات الحرجة؛ القاعدة تبدأ بها","عدد الإخفاقات لا يهم في السلامة؛ حالة واحدة تكفي للإيقاف","المراقبة بعد الإطلاق لا تحمي أول من يقع في الحالة نفسها",""],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-s4-gap-fix","type":"single","prompt":"بحسب قاعدة القرار في هذا المقرر: نجح مساعد في 96% من الحالات العربية و90% من الإنجليزية، ولا إخفاق حرجًا. ما القرار؟","options":[{"key":"أ","text":"إطلاق، لأن النسبتين عند 90% أو فوقها"},{"key":"ب","text":"إيقاف، لأن الإنجليزية عند الحد الأدنى تمامًا"},{"key":"ج","text":"إصلاح ثم إعادة الاختبار"},{"key":"د","text":"إطلاق بالعربية وحدها، وإيقاف الإنجليزية"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الفرق بين اللغتين 6 نقاط، وهو فوق حد 5 نقاط في قاعدة المقرر، فالقرار إصلاح ثم إعادة الاختبار.","misconceptions":["القاعدة تشترط أيضًا ألا يزيد الفرق بين اللغتين على 5 نقاط، والفرق هنا 6","الإيقاف للغة دون 70% أو لإخفاق حرج في السلامة أو الخصوصية، وليس هنا شيء من ذلك","","القاعدة تحكم على المساعد كله، وإطلاقه بلغة واحدة يحرم فئة من الخدمة"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-s1-transparency","type":"single","prompt":"ما الذي يميز سجل الشفافية المنشور عن قيد النظام في سجل الأنظمة الداخلي؟","options":[{"key":"أ","text":"أنه يحوي الشفرة المصدرية وإعدادات النموذج وبيانات تدريبه"},{"key":"ب","text":"أنه مكتوب للجمهور: ماذا يفعل النظام ومن المسؤول عنه"},{"key":"ج","text":"أنه وثيقة داخلية لا يطّلع عليها إلا المدقق"},{"key":"د","text":"أنه يغني عن القيد الداخلي، فلا حاجة إلى الاثنين معًا في الوزارة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"السجل الداخلي يحصر الأنظمة ومالكيها، وسجل الشفافية يشرحها للناس. القسم 3.3 من مبادئ الذكاء الاصطناعي التوليدي يطلب إعلام المستفيدين بوضوح.","misconceptions":["الشفافية للجمهور تشرح الاستخدام والمسؤولية، ولا تتطلب نشر الشفرة","","هذا وصف السجل الداخلي، والفرق أن سجل الشفافية منشور","القيد الداخلي يخدم الإدارة والتدقيق، والسجل المنشور يخدم الجمهور، ولكل غرضه"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-s2-risk-level","type":"single","prompt":"خطر احتماليته 1 (نادر) وأثره 4 (كارثي). ما مستواه بحسب الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي؟","options":[{"key":"أ","text":"4، متوسط"},{"key":"ب","text":"4، كارثي"},{"key":"ج","text":"5، متوسط"},{"key":"د","text":"16، كارثي"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"المستوى = الاحتمالية × الأثر = 1 × 4 = 4، وهو في نطاق «متوسط» (3 إلى 6). ندرة الخطر لا تلغي أثره: يبقى في السجل وله مالك ومعالجة.","misconceptions":["","الأثر الكارثي لا يجعل المستوى كارثيًا؛ «كارثي» للمستوى 16 وحده","الإطار يضرب الاحتمالية في الأثر ولا يجمعهما","المستوى ناتج الضرب، لا أعلى القيمتين مضروبًا في نفسها"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-s2-transfer-tf","type":"tf","prompt":"نقل الخطر إلى المزوّد بعقد يرفع عن الوزارة مسؤوليتها عنه بحسب الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"خطأ. الإطار يعدّ النقل أحد خيارات المعالجة، لكنه لا يرفع عن الجهة مسؤوليتها عن الخطر.","misconceptions":["من يظن أن العقد ينقل المسؤولية يترك الخطر بلا مالك داخل الوزارة",""],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-s3-appeal-reviewer","type":"single","prompt":"أُلغيت بطاقة نقل ميسّر لحاملها بقرار موظف استند إلى اقتراح من المساعد، فتظلّم. من يراجع التظلم؟","options":[{"key":"أ","text":"مشرف الموظف، لأنه اعتمد قرار الإلغاء الأصلي"},{"key":"ب","text":"مشغّل النقل، لأنه يعرف رحلات الحامل وسلوكه"},{"key":"ج","text":"موظف مؤهل لم يشارك في قرار الإلغاء، ويملك تعديله"},{"key":"د","text":"لجنة تجتمع كل ستة أشهر حين تتجمع التظلمات"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"المراجعة تستحق اسمها حين يجريها من لم يشارك في القرار ولا في اعتماده، ويملك تغييره، في مدة معلومة.","misconceptions":["من اعتمد القرار شارك فيه، فلا يراجعه؛ هذا هو الفصل بين المهام","المشغّل طرف خارج الوزارة، لا يملك قرارًا عامًا ولا يُسأل عنه","","الحامل بلا بطاقة طوال المدة؛ التظلم له مدة يُبت فيها"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-s4-levels","type":"single","prompt":"في إطار المعايير المهنية في البيانات والذكاء الاصطناعي، ما معنى أن عنصرًا في بطاقة مهنة عند المستوى L3؟","options":[{"key":"أ","text":"أن الموظف في المرتبة الثالثة من سلم الخدمة المدنية"},{"key":"ب","text":"أن الموظف أمضى ثلاث سنوات على الأقل في المهنة نفسها"},{"key":"ج","text":"أن المهنة تتطلب ثلاث شهادات معتمدة"},{"key":"د","text":"أن العنصر أعقد من عناصر L1 وL2"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"مستويات L1 إلى L4 في الإطار مستويات تعقيد للعناصر (المهام والمهارات والمعارف والقدرات)، لا درجات وظيفية.","misconceptions":["المستويات في الإطار تصف تعقيد العنصر، لا مرتبة الموظف","الإطار لا يربط المستوى بسنوات الخبرة","المستوى لا يعدّ الشهادات؛ هو وصف للمهمة أو المهارة أو المعرفة",""],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-s4-card","type":"single","prompt":"تحتاج وزارة إلى من يقود تقييم المخاطر لمساعد المواطنين ويحدّث سجلها. أي بطاقة في إطار المعايير المهنية أقرب إلى الدور؟","options":[{"key":"أ","text":"محلل مخاطر الذكاء الاصطناعي (AI-RA)"},{"key":"ب","text":"مدير منتج الذكاء الاصطناعي (AI-PM)"},{"key":"ج","text":"الرئيس التنفيذي للذكاء الاصطناعي (AI-CO)"},{"key":"د","text":"أخصائي حوكمة البيانات (D-DG)"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"بطاقة محلل مخاطر الذكاء الاصطناعي هي الأقرب إلى تحديد المخاطر وتقييمها ومتابعتها، ويبقى مالك المنتج منفصلًا عنها.","misconceptions":["","مدير المنتج مالك للخدمة، وجعله مقيّم مخاطرها يخلط الدورين","البطاقة قيادية تعتمد السجل ولا تُعدّه","حوكمة البيانات تغطي جزءًا من المخاطر، لا مخاطر النظام كله"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-s4-cards-tf","type":"tf","prompt":"بطاقة المهنة في إطار المعايير المهنية في البيانات والذكاء الاصطناعي تصف وظيفة في جهة بعينها، فلا تصلح لوزارة أخرى.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"خطأ. الإطار يصف مهنًا متخصصة على المستوى الوطني، وتستعمل كل جهة بطاقاتها لتحديد أدوارها المستهدفة ومستوياتها.","misconceptions":["من يقرأ البطاقة وصفًا وظيفيًا لجهة واحدة لا يستعملها لبناء خطة لجهته",""],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-s4-one-programme","type":"single","prompt":"خطة تطوير تضع موظفي الوزارة كلهم في برنامج عام واحد عن الذكاء الاصطناعي. ما عيبها الأساسي؟","options":[{"key":"أ","text":"أنها أغلى دائمًا من البرامج المتخصصة"},{"key":"ب","text":"أنها لا تبدأ من الأدوار المستهدفة ومستوياتها"},{"key":"ج","text":"أن البرامج العامة ممنوعة في الجهات الحكومية"},{"key":"د","text":"أنها تُسند التدريب إلى مزوّد خارجي لا يعرف الوزارة"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"خطة الكفاءات تبدأ من الأدوار التي تحتاجها الخدمة ومستوى كل منها، ثم تقيس الفجوة وسدّها، لا عدد المتدربين.","misconceptions":["البرنامج العام قد يكون أرخص؛ العيب في أنه لا يسد فجوة محددة","","لا يوجد منع كهذا، وللبرنامج العام مكان عند خط الأساس","مصدر التدريب لا يحدد جودة الخطة؛ المهم أن تبدأ من الأدوار"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"cap-order","type":"single","prompt":"إحاطة وزارية مدتها 8 دقائق أمام لجنة. ما الذي يأتي أولًا؟","options":[{"key":"أ","text":"خلفية عن الذكاء الاصطناعي ونماذجه"},{"key":"ب","text":"منهج الاختبار بالتفصيل قبل نتيجته"},{"key":"ج","text":"قائمة بكل المخاطر المحتملة دون ترتيب"},{"key":"د","text":"التوصية والقرار المطلوب، ثم الأدلة"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"اللجنة تجتمع لتقرر، فيبدأ الموجز بما يُطلب منها أن تقرره، ثم يقدم ما يكفي من الدليل لتثق بالتوصية.","misconceptions":["اللجنة لا تحتاج درسًا، وكل دقيقة في الخلفية تُقتطع من الدليل","المنهج يُسأل عنه إن شكّت اللجنة، والنتيجة وما تعنيه أولًا","قائمة بلا ترتيب تترك اللجنة لتقرر وحدها ما المهم",""],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"cap-unknown","type":"single","prompt":"سألت اللجنة سؤالًا لا تجد جوابه في أدلتك. ما الرد الأنسب؟","options":[{"key":"أ","text":"أن تقول ما لا تعرفه، ومتى ستأتي بالجواب"},{"key":"ب","text":"أن تقدّر رقمًا قريبًا حتى لا تبدو غير مستعد"},{"key":"ج","text":"أن تحيل السؤال إلى المزوّد"},{"key":"د","text":"أن تعيد عرض التوصية وأدلتها كما قدمتها"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"الصراحة في حدود الدليل، مع التزام محدد بالجواب، تحفظ ثقة اللجنة في بقية الأرقام.","misconceptions":["","الرقم المرتجل يصير في محضر اللجنة دليلًا لم يُفحص","المساءلة على الوزارة، والإحالة إلى المزوّد تنقل السؤال إلى من لا يُسأل","تكرار التوصية لا يجيب، واللجنة ترى أن السؤال لم يُجب"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"cap-in-force-tf","type":"tf","prompt":"على الموجز أن يذكر النص النافذ في تاريخ الإحاطة، فإن كان نظام جديد صدر ولم يبدأ العمل به بعدُ ذُكر ذلك صراحة.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"صح. نظام المنافسات والمشتريات الحكومية (1448هـ) مثال: نُشر في سبتمبر 2026 ويعمل به بعد 120 يومًا، وحتى ذلك يبقى نظام (م/128) نافذًا.","misconceptions":["","من يستشهد بنظام لم يبدأ العمل به على أنه نافذ يبني التوصية على أساس غير قائم بعد"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"}]}</script>
